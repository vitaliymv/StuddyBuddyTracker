{% extends 'tracker/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="mb-4 text-center">
                    Register
                </h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-success w-100">
                        Register
                    </button>
                </form>

                <div class="mt-3 text-center">
                    <a href="{% url 'login' %}">
                        Already have an account?
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
